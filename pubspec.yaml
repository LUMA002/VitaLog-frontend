name: vita_log
description: "VitaLog (V2) Offline-First App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- UI, Navigation and Localization ---
  go_router: ^17.2.3 # Navigation, deep links, shell routes
  slang_flutter: ^4.14.0 # Typed i18n in widgets (t.*)

  # --- State Management ---
  flutter_riverpod: ^3.3.1 # Provider-based state management
  riverpod_annotation: ^4.0.2  # @riverpod codegen annotations

  # --- Local DB (Offline-First) ---
  drift: ^2.31.0 # SQLite ORM, streams, migrations
  sqlite3: ^2.9.4 # FFI SQLite API (temp dir on Android)
  sqlite3_flutter_libs: ^0.5.19 # Ships libsqlite3.so on Android
  path_provider: ^2.1.5 # File system access
  path: ^1.9.0 # File path operations

  # --- Data Models ---
  freezed_annotation: ^3.1.0 # Immutable models, sealed unions
  json_annotation: ^4.11.0 # DTO JSON field metadata
  uuid: ^4.5.1 # Client-side v4 IDs
  intl: ^0.20.2 # Date/time/number formatting in UI

  # --- Network and Synchronization ---
  dio: ^5.9.2 # HTTP client
  connectivity_plus: ^7.1.1 # WiFi / mobile interface presence check
  internet_connection_checker_plus: ^3.0.0 # Real internet reachability


  # --- Preferences ---
  shared_preferences: ^2.5.3 # App settings (Wi-Fi only sync, etc.)

  # --- Security and Logging ---
  flutter_secure_storage: ^10.2.0 # Encrypted JWT storage
  talker_flutter: ^5.1.17 # In-app log viewer (Settings -> Dev)
  talker_dio_logger: ^5.1.17 # Dio request/response logging

  # --- Notifications (Sliding Window) ---
  flutter_local_notifications: ^21.0.0 # Local intake reminders
  timezone: ^0.11.0 # Schedule notifications in local TZ

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --- Code Generation ---
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.3
  drift_dev: ^2.31.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  slang: ^4.14.0 # CLI: dart run slang (avoids slang_build_runner asset conflict)

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
